name: arduino duo release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to release, e.g. v0.3.0
        required: true
        type: string
      force-update:
        description: (DANGER!!) replace an already published platform version in the index
        required: false
        default: false
        type: boolean

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
        fetch-depth: 0

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: build release files
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        FORCE: ${{ inputs.force-update == true && '--force' || '' }}
      run: python3 package/release.py --tag "$RELEASE_TAG" --out dist $FORCE

    - name: build docs
      run: |
        pip3 install sphinx sphinx-copybutton sphinx_multiversion sphinx_rtd_theme
        cd docs
        make html
        tar -zcf ../dist/docs_html.tar.gz ./build/

    - name: create release and upload assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        body: TODO New Release.
        draft: false
        prerelease: false
        files: dist/*
